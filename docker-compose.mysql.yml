# 方案 B 覆盖文件：compose 内置 MySQL。
# 用法：docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d
# 前置：.env 中设置 DB_ROOT_PASSWORD，且 DB_CONNECTION_STRING 指向 Data Source=mysql（详见 docker-compose.yml 文件头注释）。

services:
  app:
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: logicnet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: logicnet
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - logicnet-mysql:/var/lib/mysql
    # 默认不对宿主暴露端口；如需从外部管理工具连接，放开以下两行（仅回环地址）：
    # ports:
    #   - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  logicnet-mysql:
