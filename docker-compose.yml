name: logicnet

# LogicNet 应用编排。敏感配置通过同目录 secrets.json 挂载注入（模板见 secrets.json.example；
# 经实测 Furion 捕获的 App.Configuration 不含进程环境变量，故不使用环境变量传密钥，详见 DEPLOY.md）。
# .env 仅用于 compose 变量插值（APP_PORT、方案 B 的 DB_ROOT_PASSWORD）。
# 数据库两种模式（默认 A）：
#   A. 复用外部 MySQL（默认）：secrets.json 的 ConnectionString 指向已有实例，无需其他改动。
#   B. compose 内置 MySQL：启动命令追加覆盖文件（数据持久化在 logicnet-mysql 卷）：
#        docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d
#      并把 secrets.json 的连接串改为（密码与 .env 的 DB_ROOT_PASSWORD 一致）：
#        Data Source=mysql;Database=logicnet;User ID=root;Password=<DB_ROOT_PASSWORD>;pooling=true;port=3306;CharSet=utf8mb4;SslMode=none
#      注意：内置模式不要在宿主再占用 3306。

services:
  app:
    build:
      context: .
      dockerfile: LogicNet.Web.Entry/Dockerfile
    image: logicnet:latest
    container_name: logicnet-app
    restart: unless-stopped
    ports:
      # 左侧为宿主端口，可在 .env 用 APP_PORT 覆盖
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      # 机密配置（JWT 密钥、数据库连接串）：只读挂载，宿主上属主应为容器内 app 用户（uid 1654）、
      # 权限 600。准备步骤见 DEPLOY.md；模板见 secrets.json.example。
      - ./secrets.json:/app/secrets.json:ro
      # 容器内 DNS：部分 NAS（如飞牛）生成的 /etc/resolv.conf 为 640 root:root，非 root 应用用户读不到，
      # 会导致无法解析 mysql 等服务名。只读挂载仓库内可读的 resolv.conf，显式使用 Docker 内置 DNS。
      - ./resolv.conf:/etc/resolv.conf:ro
      # 命名卷持久化应用日志（/app/Logs，属主为容器内 app 用户 uid 1654）。
      # 若想直接在 NAS 文件管理器查看，可改为绑定挂载，例如：
      #   - ./volumes/logs:/app/Logs
      # 绑定挂载需先执行：mkdir -p ./volumes/logs && sudo chown -R 1654:1654 ./volumes/logs
      - logicnet-logs:/app/Logs
    healthcheck:
      # 镜像内无 curl（且 NAS 构建沙箱内无法 apt 安装），用 bash /dev/tcp 发起 HTTP 探测
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \" 200\" <&3'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  logicnet-logs:
